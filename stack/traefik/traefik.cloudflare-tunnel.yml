# Hôte derrière une box : privé via Tailscale, public via Cloudflare Tunnel.
entryPoints:
  tailnet-http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: tailnet
          scheme: https
  tailnet:
    address: ":443"
    http:
      tls:
        certResolver: cf
        domains:
          - main: "{{ env `PRIVATE_ZONE` }}"
            sans: ["*.{{ env `PRIVATE_ZONE` }}"]
  tunnel:
    # HTTP clair, joignable uniquement par cloudflared via traefik-net (port 8080 non publié).
    address: ":8080"
    forwardedHeaders:
      trustedIPs: ["172.16.0.0/12", "10.0.0.0/8"]

providers:
  docker:
    exposedByDefault: false
    network: traefik-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  cf:
    acme:
      email: "{{ env `ACME_EMAIL` }}"
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers: ["1.1.1.1:53", "1.0.0.1:53"]

api:
  dashboard: true

log:
  level: INFO
accessLog: {}
