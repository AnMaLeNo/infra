services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      # MQTT n'est pas HTTP : lié à l'IP Tailscale uniquement (jamais 0.0.0.0)
      - "${TAILSCALE_IP}:1883:1883"
    volumes:
      - ./config:/mosquitto/config:ro
      - ${STACK_STATE}/data:/mosquitto/data
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  traefik-net:
    external: true
