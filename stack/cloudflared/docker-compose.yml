services:
  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${STACK_STATE}/config.yml:/etc/cloudflared/config.yml:ro
      - ${STACK_STATE}/credentials.json:/etc/cloudflared/credentials.json:ro
    environment:
      TUNNEL_ID: ${TUNNEL_ID}
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
