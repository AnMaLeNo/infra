services:
  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    container_name: infra-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${STACK_STATE}:/etc/cloudflared:ro
    environment:
      TUNNEL_ID: ${TUNNEL_ID}
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
