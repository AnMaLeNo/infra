# Décrit le serveur. Un repo de config = un serveur.
name: pi                                 # nom court, aussi nom du tunnel Cloudflare
tailscale_ip: 100.72.6.43                # `tailscale ip -4` ; les entrypoints privés de Traefik écoutent ici
public_zone: antoine42.com               # zone Cloudflare
private_zone: pi.antoine42.com           # *.pi.antoine42.com → tailscale_ip
lan_ip: 192.168.1.101                            # IP LAN de l'hôte si des clients sans Tailscale (ESP…) doivent joindre un service partagé (`listen: [lan]`)
public_ingress: cloudflare-tunnel        # cloudflare-tunnel | direct (VPS avec IP publique)
public_ip: null                          # requis si direct
cloudflare:
  zone_id: ""                            # rempli par `infra tunnel create` / `infra dns bootstrap`
  account_id: ""
  tunnel_id: ""
llm:                                     # claude -p, pour tous les runs (modifiable dans le front, ⚙)
  model: sonnet                          # alias (sonnet, opus, haiku) ou nom complet
  effort: high                           # low | medium | high | xhigh | max
stacks: [traefik, cloudflared, ui]
exceptions:                              # ce qui ne tourne pas en Docker, et pourquoi
  - name: infra-runner
    reason: lance `claude -p` avec la session Claude de l'hôte et pilote docker/systemd
  - name: infra-editor
    reason: VS Code web (`code serve-web`, Microsoft) sous ai-infra pour reprendre la session Claude d'un run ; doit voir ~ai-infra/.claude et le dossier des runs
notes: ""
