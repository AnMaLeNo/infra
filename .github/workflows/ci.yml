name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund && npx oxlint src && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: docker compose -f stack/traefik/docker-compose.yml config -q
        env: { TAILSCALE_IP: 100.64.0.1, STACK_STATE: /tmp, CF_API_TOKEN: x, PRIVATE_ZONE: pi.example.com, ACME_EMAIL: a@b.c, PUBLIC_INGRESS: cloudflare-tunnel }
  # Binaires pour install.sh : compilés dans rust:1-bookworm (glibc 2.36, celle de Debian 12 sur le Pi ; ubuntu-latest a
  # une glibc trop récente), x86_64 natif + aarch64 cross-compilé avec le gcc Debian ; attachés à la release du tag.
  binaries:
    needs: test
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: rustup target add aarch64-unknown-linux-gnu && apt-get update -qq && apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release && cp target/release/infra infra-x86_64
      - run: cargo build --release --target aarch64-unknown-linux-gnu && cp target/aarch64-unknown-linux-gnu/release/infra infra-aarch64
        env: { CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc }
      - run: objdump -T infra-aarch64 | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -1
      - uses: actions/upload-artifact@v4
        with: { name: infra-binaries, path: "infra-*" }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            infra-x86_64
            infra-aarch64
  # Sur une PR : construction seule (amd64) pour valider le Dockerfile ; sur main et les tags : multi-arch poussée sur ghcr.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
