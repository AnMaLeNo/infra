[project]
name = "infra"
version = "0.1.0"
description = "Déploiement déclaratif de projets GitHub sur un serveur, piloté par un LLM."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "mcp>=1.2",
]

[project.scripts]
infra = "infra.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"infra/tools.py" = ["E501"]   # docstrings = descriptions des tools MCP, longues par nature

[tool.pytest.ini_options]
testpaths = ["tests"]
